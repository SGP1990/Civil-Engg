<script>
const P=[{"t": "Hydrological Cycle", "h": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Hydrological Cycle<\/title>\n<style>body{margin:0;background:#222;text-align:center}canvas{background:#bfe6ff;max-width:100%}<\/style>\n<\/head>\n<body>\n<canvas id=\"c\" width=\"900\" height=\"560\"><\/canvas>\n<script>\nconst c = document.getElementById('c'), g = c.getContext('2d');\nconst W = 900, H = 560;\nconst rnd = (a, b) => a + Math.random() * (b - a);\n\n// particle types: vapor (rising), rain (falling), runoff (flowing to sea), ground (seeping)\nlet p = [];\nfunction spawn(t, x, y) { p.push({t, x, y, a: 1}); }\n\nfunction drawScene() {\n  // sky/sun\n  g.fillStyle = '#ffd84d'; g.beginPath(); g.arc(820, 60, 38, 0, 7); g.fill();\n  // mountain\n  g.fillStyle = '#7a7a7a'; g.beginPath(); g.moveTo(0, 400); g.lineTo(220, 200); g.lineTo(420, 400); g.fill();\n  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(190, 230); g.lineTo(220, 200); g.lineTo(250, 230); g.lineTo(220, 240); g.fill();\n  // land\n  g.fillStyle = '#6dbb5a'; g.beginPath(); g.moveTo(0, 400); g.lineTo(420, 400); g.lineTo(560, 430); g.lineTo(560, 460); g.lineTo(0, 460); g.fill();\n  // soil\n  g.fillStyle = '#9b7653'; g.fillRect(0, 460, 560, 100);\n  // groundwater\n  g.fillStyle = '#4a8fd6'; g.fillRect(0, 520, 560, 40);\n  // ocean\n  g.fillStyle = '#1e6fb8'; g.fillRect(560, 430, 340, 130);\n  // tree\n  g.fillStyle = '#6b4226'; g.fillRect(330, 360, 10, 40);\n  g.fillStyle = '#2e8b3a'; g.beginPath(); g.arc(335, 350, 24, 0, 7); g.fill();\n  // clouds\n  g.fillStyle = '#fff';\n  [[560, 100], [610, 90], [660, 105], [600, 115]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 35, 0, 7); g.fill(); });\n}\n\nfunction label(txt, x, y) {\n  g.fillStyle = '#000'; g.font = 'bold 14px sans-serif'; g.fillText(txt, x, y);\n}\n\nlet frame = 0;\nfunction loop() {\n  frame++;\n  g.clearRect(0, 0, W, H);\n  drawScene();\n\n  // emit\n  if (frame % 4 === 0) spawn('evap', rnd(580, 880), 435);          // evaporation from ocean\n  if (frame % 10 === 0) spawn('trans', rnd(315, 355), 335);        // transpiration from plants\n  if (frame % 12 === 0) spawn('subl', rnd(195, 245), 215);         // sublimation from snow\n  if (frame % 3 === 0) spawn('rain', rnd(540, 680), 140);          // precipitation\n  if (frame % 15 === 0) spawn('run', rnd(240, 300), 330);          // runoff\n  if (frame % 20 === 0) spawn('infil', rnd(60, 300), 462);         // infiltration\n\n  p.forEach(q => {\n    if (q.t === 'evap' || q.t === 'trans' || q.t === 'subl') {\n      q.y -= 1.6; q.x += (q.t === 'evap' ? -0.5 : 0.3);\n      q.a = Math.max(0, 1 - (435 - q.y) / 330);\n      if (q.y < 130) q.dead = true;\n      g.fillStyle = `rgba(255,255,255,${q.a})`; g.strokeStyle = 'rgba(80,80,80,.3)';\n    } else if (q.t === 'rain') {\n      q.y += 5; q.x -= 0.5;\n      if (q.y > 430) q.dead = true;\n      g.fillStyle = '#2255cc';\n    } else if (q.t === 'run') {\n      q.x += 1.8; q.y = q.x < 420 ? 330 + (q.x - 240) * 0.38 : 400 + (q.x - 420) * 0.21;\n      if (q.x > 565) q.dead = true;\n      g.fillStyle = '#3b9cff';\n    } else if (q.t === 'infil') {\n      q.y += 1.2;\n      if (q.y > 520) { q.t = 'ground'; }\n      g.fillStyle = '#3b9cff';\n    } else if (q.t === 'ground') {\n      q.x += 1.5;\n      if (q.x > 560) q.dead = true;\n      g.fillStyle = '#9fd0ff';\n    }\n    g.beginPath(); g.arc(q.x, q.y, q.t === 'rain' ? 2.5 : 3, 0, 7); g.fill();\n  });\n  p = p.filter(q => !q.dead);\n\n  // labels\n  label('Condensation (cloud forms)', 520, 50);\n  label('Precipitation', 700, 220);\n  label('Evaporation', 700, 410);\n  label('Transpiration', 270, 310);\n  label('Sublimation', 130, 195);\n  label('Surface runoff', 330, 425);\n  label('Infiltration', 70, 495);\n  label('Groundwater flow', 200, 545);\n  label('Ocean', 700, 500);\n\n  requestAnimationFrame(loop);\n}\nloop();\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Rain Gauge", "h": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Rain Gauge Animation<\/title>\n<style>\n  body{font-family:Arial,sans-serif;text-align:center;background:#eef3f8;margin:10px}\n  canvas{background:#dfeaf5;border:2px solid #456;border-radius:8px}\n  button{padding:6px 14px;margin:4px;font-size:14px}\n<\/style>\n<\/head>\n<body>\n<h3>Symons' Rain Gauge vs Tipping-Bucket Rain Gauge<\/h3>\n<canvas id=\"c\" width=\"800\" height=\"440\"><\/canvas><br>\n<button onclick=\"rain=!rain\">Rain ON / OFF<\/button>\n<button onclick=\"measure()\">Measure Symons' bottle<\/button>\n<button onclick=\"resetAll()\">Reset<\/button>\n<script>\nconst c = document.getElementById('c'), g = c.getContext('2d');\nlet rain = true, drops = [];\nlet sCount = 0, sReading = null;                 // Symons\nlet fill = 0, tips = 0, angle = -0.3, target = -0.3, side = -1, log = []; // Tipping bucket\nconst MM_PER_DROP = 0.1, MM_PER_TIP = 0.2, DROPS_PER_TIP = 25;\n\nfunction resetAll(){drops=[];sCount=0;sReading=null;fill=0;tips=0;log=[];angle=target=-0.3;side=-1;}\nfunction measure(){ sReading = (sCount*MM_PER_DROP).toFixed(1); }\n\nfunction update(){\n  if(rain && Math.random()<0.6)\n    drops.push({x:Math.random()*800, y:0, v:4+Math.random()*3});\n  drops.forEach(d=>{\n    d.y += d.v;\n    if(d.y>=190 && d.x>110 && d.x<290){ d.dead=true; sCount++; }          // Symons funnel\n    else if(d.y>=190 && d.x>510 && d.x<690){ d.dead=true; fill+=1/DROPS_PER_TIP; } // tipping funnel\n    else if(d.y>=430) d.dead=true;\n  });\n  drops = drops.filter(d=>!d.dead);\n  if(fill>=1){                       // bucket tips\n    fill=0; tips++; side*=-1; target = side*0.3;\n    log.push(((performance.now()/1000)%1000).toFixed(1)+\" s\");\n    if(log.length>4) log.shift();\n  }\n  angle += (target-angle)*0.15;\n}\n\nfunction draw(){\n  g.clearRect(0,0,800,440);\n  g.fillStyle='#8a6d3b'; g.fillRect(0,420,800,20);           // ground\n  g.fillStyle='#000'; g.font='bold 15px Arial';\n  g.fillText(\"Symons' Rain Gauge (manual)\",110,25);\n  g.fillText(\"Tipping-Bucket Gauge (automatic)\",470,25);\n  g.strokeStyle='#345'; g.lineWidth=3;\n\n  // ---- Symons ----\n  g.strokeRect(150,260,100,160);                              // outer cylinder\n  g.beginPath(); g.moveTo(110,190); g.lineTo(290,190); g.lineTo(215,260); g.lineTo(185,260); g.closePath(); g.stroke(); // funnel\n  g.strokeRect(170,300,60,120);                               // bottle\n  let h = Math.min(sCount*0.35,118);\n  g.fillStyle='rgba(30,110,220,.8)'; g.fillRect(171,419-h,58,h);\n  g.fillStyle='#000'; g.font='13px Arial';\n  g.fillText(\"Funnel\",300,200); g.fillText(\"Collecting bottle\",235,360);\n  g.fillText(\"Outer cylinder\",255,285);\n  g.fillText(\"Collected: \"+(sCount*MM_PER_DROP).toFixed(1)+\" mm (not shown to observer)\",70,70);\n  g.fillText(sReading===null?\"Reading: press 'Measure'\":\"Measuring cylinder reading: \"+sReading+\" mm\",70,90);\n\n  // ---- Tipping bucket ----\n  g.beginPath(); g.moveTo(510,190); g.lineTo(690,190); g.lineTo(615,250); g.lineTo(585,250); g.closePath(); g.stroke();\n  g.strokeRect(520,250,160,170);                              // housing\n  g.save(); g.translate(600,340); g.rotate(angle);            // bucket\n  g.lineWidth=3; g.strokeStyle='#222';\n  g.beginPath(); g.moveTo(-45,0); g.lineTo(0,25); g.lineTo(45,0); g.stroke();\n  g.beginPath(); g.moveTo(0,25); g.lineTo(0,-30); g.stroke();  // divider\n  // cup receiving water is the one under the funnel\n  let cx = side===-1 ? -22 : 22;\n  g.fillStyle='rgba(30,110,220,.85)';\n  g.fillRect(cx-14, 10-fill*25, 28, fill*25);\n  g.restore();\n  g.fillStyle='#000'; g.beginPath(); g.arc(600,340,4,0,7); g.fill();\n  g.fillStyle='#a00'; g.fillRect(660,330,10,22);              // magnet/switch\n  g.fillStyle='#000'; g.font='13px Arial';\n  g.fillText(\"Pivot\",608,335); g.fillText(\"Magnet + reed switch\",600,372);\n  g.fillText(\"Tips: \"+tips+\"   Rainfall = \"+tips+\" x \"+MM_PER_TIP+\" = \"+(tips*MM_PER_TIP).toFixed(1)+\" mm\",470,70);\n  g.fillText(\"Logger (time of tips): \"+(log.join(\", \")||\"-\"),470,90);\n  g.fillStyle='#fff'; g.fillRect(535,395,130,12);\n  g.fillStyle='#38f'; g.fillRect(535,395,130*fill,12);\n  g.strokeStyle='#000'; g.lineWidth=1; g.strokeRect(535,395,130,12);\n  g.fillStyle='#000'; g.fillText(\"Bucket fill\",570,392);\n\n  // ---- raindrops ----\n  g.strokeStyle='#2060c0'; g.lineWidth=2;\n  drops.forEach(d=>{g.beginPath(); g.moveTo(d.x,d.y); g.lineTo(d.x,d.y+8); g.stroke();});\n}\n(function loop(){update();draw();requestAnimationFrame(loop);})();\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Flood Discharge", "h": "<!DOCTYPE html>\n<html><head><meta charset=\"utf-8\"><title>Sikkim Peak Flood Estimation<\/title>\n<style>\nbody{font-family:sans-serif;margin:10px;background:#f4f7f4}\ncanvas{background:#dfeaf5;border:1px solid #888;width:100%;max-width:820px}\nlabel{display:block;margin:3px 0;font-size:14px}\n.p{display:flex;flex-wrap:wrap;gap:20px}\n<\/style><\/head><body>\n<h3>Peak Flood Discharge \u2013 Rational &amp; Empirical Methods (Sikkim hill catchment)<\/h3>\n<div class=\"p\">\n<div>\n<label>Area A (km\u00b2): <b id=\"vA\"><\/b><input id=\"A\" type=\"range\" min=\"1\" max=\"200\" value=\"25\"><\/label>\n<label>Runoff coeff. C: <b id=\"vC\"><\/b><input id=\"C\" type=\"range\" min=\"0.2\" max=\"0.9\" step=\"0.05\" value=\"0.6\"><\/label>\n<label>1-hr rainfall intensity (mm/h): <b id=\"vI\"><\/b><input id=\"I\" type=\"range\" min=\"10\" max=\"120\" value=\"60\"><\/label>\n<label>Longest flow path L (km): <b id=\"vL\"><\/b><input id=\"L\" type=\"range\" min=\"1\" max=\"40\" value=\"8\"><\/label>\n<label>Average slope S (m/m): <b id=\"vS\"><\/b><input id=\"S\" type=\"range\" min=\"0.02\" max=\"0.5\" step=\"0.01\" value=\"0.2\"><\/label>\n<label>Dickens constant (11\u201314 hilly): <b id=\"vD\"><\/b><input id=\"D\" type=\"range\" min=\"11\" max=\"14\" step=\"0.5\" value=\"13.5\"><\/label>\n<label>Ryves constant (6.8 / 8.5 / 10.2): <b id=\"vR\"><\/b><input id=\"R\" type=\"range\" min=\"6.8\" max=\"10.2\" step=\"1.7\" value=\"10.2\"><\/label>\n<button onclick=\"t=0\">Replay<\/button>\n<\/div>\n<canvas id=\"c\" width=\"820\" height=\"460\"><\/canvas>\n<\/div>\n<p style=\"font-size:13px;max-width:820px\">\n<b>Rational:<\/b> Q = C\u00b7i\u00b7A / 3.6 (i in mm/h, A in km\u00b2, Q in m\u00b3/s), with i = i\u2081\u2095\u00b7(tc/60)^-0.6 and Kirpich tc = 0.0195\u00b7L^0.77\u00b7S^-0.385 (L in m, tc in min).<br>\n<b>Dickens:<\/b> Q = C\u00b7A^(3/4) &nbsp; <b>Ryves:<\/b> Q = C\u00b7A^(2/3) &nbsp; <b>Inglis:<\/b> Q = 124A/\u221a(A+10.4) (derived for Western Ghats; shown for comparison only).<br>\nCalibrate constants with local gauge data (e.g., Teesta and Rangit basins) before design use.<\/p>\n<script>\nconst cv=document.getElementById('c'),g=cv.getContext('2d');\nconst ids=['A','C','I','L','S','D','R'],v={};\nlet t=0,drops=[];\nfor(let i=0;i<120;i++)drops.push({x:Math.random()*820,y:Math.random()*200,s:4+Math.random()*4});\nfunction read(){ids.forEach(k=>{v[k]=+document.getElementById(k).value;document.getElementById('v'+k).textContent=v[k]});}\nids.forEach(k=>document.getElementById(k).oninput=()=>{read();t=0});\nread();\nfunction calc(){\n const tc=0.0195*Math.pow(v.L*1000,0.77)*Math.pow(v.S,-0.385);\n const i=v.I*Math.pow(Math.max(tc,5)/60,-0.6);\n return {tc,i,res:[\n  ['Rational',v.C*i*v.A/3.6,'#2e7d32'],\n  ['Dickens',v.D*Math.pow(v.A,0.75),'#1565c0'],\n  ['Ryves',v.R*Math.pow(v.A,2/3),'#ef6c00'],\n  ['Inglis',124*v.A/Math.sqrt(v.A+10.4),'#8e24aa']]};\n}\nfunction frame(){\n const r=calc(),p=Math.min(t/150,1);t++;\n g.clearRect(0,0,820,460);\n // sky, hills\n g.fillStyle='#c9dcef';g.fillRect(0,0,820,200);\n g.fillStyle='#5d8a4a';g.beginPath();g.moveTo(0,230);g.lineTo(120,110);g.lineTo(220,170);g.lineTo(330,90);g.lineTo(420,200);g.lineTo(420,260);g.lineTo(0,260);g.fill();\n g.fillStyle='#3d6b34';g.beginPath();g.moveTo(0,260);g.lineTo(150,160);g.lineTo(280,230);g.lineTo(420,260);g.fill();\n // river with rising level\n const lvl=10+30*p*Math.min(1,Math.max(...r.res.map(x=>x[1]))/800+0.3);\n g.fillStyle='#2f7fc1';g.fillRect(0,260-lvl*0.3,420,lvl*0.3+10);\n g.fillStyle='#000';g.font='13px sans-serif';\n g.fillText('Catchment A = '+v.A+' km\u00b2   tc = '+r.tc.toFixed(0)+' min   i = '+r.i.toFixed(0)+' mm/h',10,20);\n // rain\n g.strokeStyle='#1e5fa8';\n drops.forEach(d=>{d.y+=d.s;d.x-=1;if(d.y>240){d.y=0;d.x=Math.random()*420}\n  if(d.x<0)d.x=420;g.beginPath();g.moveTo(d.x,d.y);g.lineTo(d.x+2,d.y+9);g.stroke();});\n // bar chart\n const ox=470,oy=420,mx=Math.max(...r.res.map(x=>x[1]),10),sc=300/mx;\n g.strokeStyle='#000';g.beginPath();g.moveTo(ox-10,oy);g.lineTo(810,oy);g.moveTo(ox-10,oy);g.lineTo(ox-10,90);g.stroke();\n g.fillText('Peak discharge Q (m\u00b3/s)',ox,80);\n r.res.forEach((e,k)=>{const h=e[1]*sc*p,x=ox+k*85;\n  g.fillStyle=e[2];g.fillRect(x,oy-h,60,h);\n  g.fillStyle='#000';g.fillText(e[0],x+5,oy+16);g.fillText((e[1]*p).toFixed(0),x+15,oy-h-5);});\n // hydrograph\n g.strokeStyle='#c62828';g.lineWidth=2;g.beginPath();\n const qp=r.res[0][1];\n for(let x=0;x<=400;x++){const u=x/400,q=u<0.3?u/0.3:Math.exp(-(u-0.3)*4);\n  const y=440-q*qp*sc*0.35*p;x?g.lineTo(10+x,y):g.moveTo(10,y);}\n g.stroke();g.lineWidth=1;g.fillStyle='#000';g.fillText('Rational-method hydrograph (schematic)',10,300);\n requestAnimationFrame(frame);\n}\nframe();\n<\/script><\/body><\/html>"}, {"t": "Crop Water", "h": "<!DOCTYPE html>\n<html><head><meta charset=\"utf-8\"><title>Crop Water Requirement<\/title>\n<style>\nbody{font-family:Arial,sans-serif;background:#f1f8e9;margin:0;padding:16px;color:#1b3a1b}\nh1{font-size:22px;margin:0 0 8px}\ncanvas{background:#e3f2fd;border:2px solid #2e7d32;border-radius:8px;width:100%;max-width:900px;display:block}\nbutton{padding:8px 14px;margin:6px 4px 6px 0;border:0;border-radius:6px;background:#2e7d32;color:#fff;cursor:pointer}\nbutton.s{background:#8d6e63}\n#info,#seas{max-width:880px;background:#fff;padding:10px 14px;border-radius:8px;margin-top:8px;font-size:14px;line-height:1.5}\n<\/style><\/head><body>\n<h1>Crop Water Requirement: Crop Period vs Base Period<\/h1>\n<canvas id=\"c\" width=\"900\" height=\"420\"><\/canvas>\n<button onclick=\"play=!play\">Pause / Play<\/button>\n<button onclick=\"t=0\">Restart<\/button>\n<div id=\"info\"><b>CWR<\/b> = water for evapotranspiration (ET) + application losses + special needs (land preparation, leaching).<br>\n<b>Crop period<\/b> = sowing to harvest. <b>Base period<\/b> = first irrigation to last irrigation before harvest (slightly shorter than crop period).<br>\n<b>Delta (\u0394)<\/b> = depth of water per base period. <b>Duty (D)<\/b> = area irrigated per cumec: D = 8.64\u00b7B/\u0394 (ha/cumec; B in days, \u0394 in m).<\/div>\n<div><b>Cropping seasons in India:<\/b><br>\n<button class=\"s\" onclick=\"season(0)\">Kharif<\/button>\n<button class=\"s\" onclick=\"season(1)\">Rabi<\/button>\n<button class=\"s\" onclick=\"season(2)\">Zaid<\/button><\/div>\n<div id=\"seas\"><\/div>\n<script>\nconst S=[\n[\"Kharif (monsoon): sowing June\u2013July, harvest Sept\u2013Oct\",\"Rice, maize, cotton, jowar, bajra, soybean, groundnut, sugarcane (long duration). Mostly rain-fed with supplementary irrigation.\"],\n[\"Rabi (winter): sowing Oct\u2013Nov, harvest Mar\u2013Apr\",\"Wheat, barley, mustard, gram, peas, linseed. Depends largely on irrigation and stored soil moisture.\"],\n[\"Zaid (summer): Mar\u2013June\",\"Watermelon, muskmelon, cucumber, moong, fodder crops. Needs high irrigation due to high ET.\"]];\nfunction season(i){document.getElementById('seas').innerHTML=\"<b>\"+S[i][0]+\"<\/b><br>\"+S[i][1]}\nseason(0);\nconst c=document.getElementById('c'),g=c.getContext('2d');\nlet t=0,play=true,drops=[];\nconst stages=[\"Land prep / pre-sowing irrigation\",\"Sowing\",\"Vegetative\",\"Flowering\",\"Maturity\",\"Harvest\"];\nfunction draw(){\n g.clearRect(0,0,900,420);\n // soil\n g.fillStyle='#795548';g.fillRect(0,300,900,120);\n // timeline\n const x0=60,x1=840,y=370,p=t/600;\n const baseStart=x0+60,baseEnd=x1-60;\n g.fillStyle='#fff';g.font='13px Arial';\n g.fillStyle='#c8e6c9';g.fillRect(x0,y,x1-x0,10);\n g.fillStyle='#1565c0';g.fillRect(baseStart,y+14,baseEnd-baseStart,10);\n g.fillStyle='#fff';\n g.fillText('Crop period (sowing \u2192 harvest)',x0,y-6);\n g.fillText('Base period (first \u2192 last irrigation)',baseStart,y+40);\n g.fillStyle='#ff6f00';g.fillRect(x0+(x1-x0)*p-2,y-12,4,50);\n // stage label\n const si=Math.min(5,Math.floor(p*6));\n g.fillStyle='#1b3a1b';g.font='bold 16px Arial';g.fillText('Stage: '+stages[si],20,28);\n // plant\n const h=Math.max(0,Math.min(1,(p-0.15)/0.6))*180;\n g.strokeStyle='#2e7d32';g.lineWidth=5;g.beginPath();g.moveTo(450,300);g.lineTo(450,300-h);g.stroke();\n for(let i=1;i<=4;i++){if(h>i*40){g.fillStyle='#43a047';g.beginPath();g.ellipse(450+(i%2?25:-25),300-i*40,22,8,0,0,7);g.fill();}}\n if(p>0.55&&p<0.9){g.fillStyle='#fdd835';g.beginPath();g.arc(450,300-h-8,10,0,7);g.fill();}\n if(p>=0.9){g.fillStyle='#fbc02d';g.fillRect(440,300-h-10,20,28);}\n // irrigation drops during base period\n const inBase=x0+(x1-x0)*p>=baseStart&&x0+(x1-x0)*p<=baseEnd;\n if(play&&inBase&&t%6==0)drops.push({x:300+Math.random()*300,y:60});\n g.fillStyle='#1976d2';\n drops.forEach(d=>{g.beginPath();g.arc(d.x,d.y,4,0,7);g.fill();d.y+=4;});\n drops=drops.filter(d=>d.y<300);\n // ET vapour\n if(p>0.1){g.fillStyle='rgba(120,144,156,.5)';g.font='13px Arial';\n  for(let i=0;i<3;i++)g.fillText('~ ET',560+i*30,280-((t/2+i*30)%120));}\n g.fillStyle='#fff';g.font='13px Arial';\n g.fillText(inBase?'Irrigating (counts in Base Period)':'Outside base period (no irrigation)',20,50);\n if(play){t++;if(t>600)t=0;}\n requestAnimationFrame(draw);\n}\ndraw();\n<\/script><\/body><\/html>"}, {"t": "Column Detailing", "h": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Column Reinforcement Detailing<\/title>\n<style>\n  body{font-family:Arial,sans-serif;text-align:center;background:#f7f7f7}\n  .row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}\n  .card{background:#fff;border:1px solid #ccc;padding:6px;width:300px}\n  .hide{opacity:0;transition:opacity .8s}\n  .show{opacity:1}\n  #caption{font-size:18px;min-height:50px;margin:10px}\n  button{padding:8px 18px;font-size:16px;margin:4px}\n  .note{font-size:12px;text-align:left;margin:4px 8px;color:#333}\n<\/style>\n<\/head>\n<body>\n<h2>Column Reinforcement Detailing (M25 concrete, Fe500 steel)<\/h2>\n<div id=\"caption\">Press Play<\/div>\n<button onclick=\"play()\">Play<\/button><button onclick=\"reset()\">Reset<\/button>\n<div class=\"row\" id=\"row\"><\/div>\n\n<script>\nconst NS=\"http://www.w3.org/2000/svg\";\nconst blue=\"#c62828\", green=\"#2e7d32\";\n\nfunction bars(pts,r){return pts.map(p=>`<circle cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"${r}\" fill=\"${blue}\"/>`).join(\"\");}\n\n// Panel definitions (cross-section drawn at 0.4 scale, 1 px = 2.5 mm)\nconst panels=[\n {title:\"(a) Square Column 400 x 400 mm\",\n  note:\"8-16\u03c6 bars (Ast = 1608 mm\u00b2, 1.0% > 0.8% min). Ties 8\u03c6 @ 250 mm c/c (least of 400 mm, 16 x 16 = 256 mm, 300 mm). Cover 40 mm.\",\n  section:()=>{\n    const x=70,y=20,s=160,c=16,b=c+8;\n    const pts=[[x+b,y+b],[x+s/2,y+b],[x+s-b,y+b],[x+b,y+s/2],[x+s-b,y+s/2],[x+b,y+s-b],[x+s/2,y+s-b],[x+s-b,y+s-b]];\n    return [\n     `<rect x=\"${x}\" y=\"${y}\" width=\"${s}\" height=\"${s}\" fill=\"#e0e0e0\" stroke=\"#555\" stroke-width=\"3\"/>`,\n     bars(pts,6),\n     `<rect x=\"${x+c}\" y=\"${y+c}\" width=\"${s-2*c}\" height=\"${s-2*c}\" fill=\"none\" stroke=\"${green}\" stroke-width=\"3\" rx=\"5\"/>`,\n     `<text x=\"${x+s/2}\" y=\"${y+s+16}\" text-anchor=\"middle\" font-size=\"12\">Cover 40 mm | 400 mm<\/text>`];},\n  elev:\"ties\", w:160, x:70},\n {title:\"(b) Rectangular Column 300 x 500 mm\",\n  note:\"6-16\u03c6 bars (Ast = 1206 mm\u00b2, 0.8% min). Ties 8\u03c6 @ 250 mm c/c (least of 300 mm, 256 mm, 300 mm). Intermediate bars supported by cross-ties. Cover 40 mm.\",\n  section:()=>{\n    const x=90,y=10,w=120,h=200,c=16,b=c+8;\n    const pts=[[x+b,y+b],[x+w-b,y+b],[x+b,y+h/2],[x+w-b,y+h/2],[x+b,y+h-b],[x+w-b,y+h-b]];\n    return [\n     `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" fill=\"#e0e0e0\" stroke=\"#555\" stroke-width=\"3\"/>`,\n     bars(pts,6),\n     `<rect x=\"${x+c}\" y=\"${y+c}\" width=\"${w-2*c}\" height=\"${h-2*c}\" fill=\"none\" stroke=\"${green}\" stroke-width=\"3\" rx=\"5\"/>`,\n     `<line x1=\"${x+b}\" y1=\"${y+h/2}\" x2=\"${x+w-b}\" y2=\"${y+h/2}\" stroke=\"${green}\" stroke-width=\"3\"/>`,\n     `<text x=\"${x+w/2}\" y=\"${y+h+16}\" text-anchor=\"middle\" font-size=\"12\">300 x 500 mm<\/text>`];},\n  elev:\"ties\", w:120, x:90},\n {title:\"(c) Circular Column Dia 450 mm\",\n  note:\"6-20\u03c6 bars (Ast = 1885 mm\u00b2, min 6 bars). Helical 8\u03c6, pitch 50 mm (\u2264 75 mm, \u2264 core dia/6, \u2265 25 mm). Cover 40 mm.\",\n  section:()=>{\n    const cx=150,cy=100,R=90,c=16,rb=R-c-8;\n    const pts=[0,1,2,3,4,5].map(i=>[cx+rb*Math.cos(i*Math.PI/3),cy+rb*Math.sin(i*Math.PI/3)]);\n    return [\n     `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${R}\" fill=\"#e0e0e0\" stroke=\"#555\" stroke-width=\"3\"/>`,\n     bars(pts,7),\n     `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${R-c}\" fill=\"none\" stroke=\"${green}\" stroke-width=\"3\"/>`,\n     `<text x=\"${cx}\" y=\"${cy+R+16}\" text-anchor=\"middle\" font-size=\"12\">Dia 450 mm<\/text>`];},\n  elev:\"spiral\", w:180, x:60}\n];\n\nfunction elevation(p){\n  const top=235, H=130, x=p.x, w=p.w, c=16;\n  let s=`<rect x=\"${x}\" y=\"${top}\" width=\"${w}\" height=\"${H}\" fill=\"#e0e0e0\" stroke=\"#555\" stroke-width=\"3\"/>`;\n  s+=[x+c+8,x+w-c-8].map(v=>`<line x1=\"${v}\" y1=\"${top}\" x2=\"${v}\" y2=\"${top+H}\" stroke=\"${blue}\" stroke-width=\"4\"/>`).join(\"\");\n  let ties=\"\";\n  if(p.elev===\"ties\"){\n    for(let y=top+10;y<top+H;y+=24)\n      ties+=`<line x1=\"${x+c}\" y1=\"${y}\" x2=\"${x+w-c}\" y2=\"${y}\" stroke=\"${green}\" stroke-width=\"3\"/>`;\n  } else {\n    for(let y=top+8;y<top+H-8;y+=12)\n      ties+=`<line x1=\"${x+c}\" y1=\"${y}\" x2=\"${x+w-c}\" y2=\"${y+8}\" stroke=\"${green}\" stroke-width=\"3\"/>`;\n  }\n  return [`<text x=\"150\" y=\"${top-6}\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\">Elevation<\/text>`+s, ties];\n}\n\nconst row=document.getElementById(\"row\");\npanels.forEach((p,i)=>{\n  const sec=p.section(), el=elevation(p);\n  row.insertAdjacentHTML(\"beforeend\",\n  `<div class=\"card\"><b>${p.title}<\/b>\n   <svg viewBox=\"0 0 300 380\" width=\"290\">\n     <g id=\"p${i}g0\" class=\"hide\">${sec[0]}${el[0]}<\/g>\n     <g id=\"p${i}g1\" class=\"hide\">${sec[1]}\n        <line x1=\"${p.x+24}\" y1=\"235\" x2=\"${p.x+24}\" y2=\"365\" stroke=\"${blue}\" stroke-width=\"4\"/><\/g>\n     <g id=\"p${i}g2\" class=\"hide\">${sec[2]}${el[1]}<\/g>\n     <g id=\"p${i}g3\" class=\"hide\">${sec[3]||\"\"}<\/g>\n   <\/svg><div class=\"note\">${p.note}<\/div><\/div>`);\n});\n\nconst steps=[\n [\"Step 1: Concrete outline (formwork) with 40 mm clear cover.\",0],\n [\"Step 2: Place longitudinal bars (Fe500) in the corners and along the faces.\",1],\n [\"Step 3: Tie lateral ties (square, rectangular) or a helical spiral (circular).\",2],\n [\"Step 4: Check dimensions, cover and spacing before concreting.\",3]\n];\nlet timers=[];\nfunction reset(){timers.forEach(clearTimeout);timers=[];\n panels.forEach((_,i)=>[0,1,2,3].forEach(g=>document.getElementById(`p${i}g${g}`).setAttribute(\"class\",\"hide\")));\n document.getElementById(\"caption\").textContent=\"Press Play\";}\nfunction play(){reset();\n steps.forEach((s,k)=>timers.push(setTimeout(()=>{\n  document.getElementById(\"caption\").textContent=s[0];\n  panels.forEach((_,i)=>document.getElementById(`p${i}g${s[1]}`).setAttribute(\"class\",\"show\"));\n },k*2500+200)));}\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Doubly Beam", "h": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Doubly Reinforced Simply Supported Beam<\/title>\n<style>\n  body{font-family:Arial,sans-serif;text-align:center;background:#f7f7f7}\n  svg{background:#fff;border:1px solid #ccc;max-width:95%}\n  .hide{opacity:0;transition:opacity .8s}\n  .show{opacity:1}\n  #caption{font-size:18px;height:50px;margin:10px;color:#222}\n  button{padding:8px 18px;font-size:16px;margin:4px}\n<\/style>\n<\/head>\n<body>\n<h2>Simply Supported Doubly Reinforced Beam: Reinforcement Detailing<\/h2>\n<div id=\"caption\">Press Play<\/div>\n<button onclick=\"play()\">Play<\/button><button onclick=\"reset()\">Reset<\/button>\n\n<svg viewBox=\"0 0 900 480\" width=\"900\">\n  <!-- Longitudinal section -->\n  <text x=\"450\" y=\"25\" text-anchor=\"middle\" font-weight=\"bold\">Longitudinal Section<\/text>\n  <g id=\"s0\" class=\"hide\">\n    <rect x=\"100\" y=\"60\" width=\"700\" height=\"120\" fill=\"#e8e8e8\" stroke=\"#555\" stroke-width=\"3\"/>\n    <polygon points=\"100,180 80,205 120,205\" fill=\"#888\"/>\n    <polygon points=\"800,180 780,205 820,205\" fill=\"#888\"/>\n    <circle cx=\"800\" cy=\"210\" r=\"5\" fill=\"#888\"/>\n    <line x1=\"60\" y1=\"215\" x2=\"140\" y2=\"215\" stroke=\"#555\"/>\n    <line x1=\"760\" y1=\"215\" x2=\"840\" y2=\"215\" stroke=\"#555\"/>\n    <text x=\"100\" y=\"235\" text-anchor=\"middle\" font-size=\"12\">Hinge support<\/text>\n    <text x=\"800\" y=\"235\" text-anchor=\"middle\" font-size=\"12\">Roller support<\/text>\n    <text x=\"450\" y=\"50\" text-anchor=\"middle\" font-size=\"12\">Span L (clear cover 25 mm all round)<\/text>\n  <\/g>\n  <!-- Compression steel -->\n  <g id=\"s1\" class=\"hide\">\n    <line x1=\"110\" y1=\"80\" x2=\"790\" y2=\"80\" stroke=\"#1565c0\" stroke-width=\"5\"/>\n    <text x=\"450\" y=\"73\" text-anchor=\"middle\" fill=\"#1565c0\" font-size=\"13\" dy=\"30\">Compression steel (top) 2 bars, hanger/anchorage<\/text>\n  <\/g>\n  <!-- Tension steel -->\n  <g id=\"s2\" class=\"hide\">\n    <line x1=\"110\" y1=\"160\" x2=\"790\" y2=\"160\" stroke=\"#c62828\" stroke-width=\"7\"/>\n    <text x=\"450\" y=\"152\" text-anchor=\"middle\" fill=\"#c62828\" font-size=\"13\" dy=\"-5\">Tension steel (bottom) 3 bars, extended into supports (Ld)<\/text>\n  <\/g>\n  <!-- Stirrups -->\n  <g id=\"s3\" class=\"hide\" stroke=\"#2e7d32\" stroke-width=\"2.5\">\n    <line x1=\"120\" y1=\"72\" x2=\"120\" y2=\"168\"/><line x1=\"140\" y1=\"72\" x2=\"140\" y2=\"168\"/>\n    <line x1=\"160\" y1=\"72\" x2=\"160\" y2=\"168\"/><line x1=\"180\" y1=\"72\" x2=\"180\" y2=\"168\"/>\n    <line x1=\"200\" y1=\"72\" x2=\"200\" y2=\"168\"/><line x1=\"220\" y1=\"72\" x2=\"220\" y2=\"168\"/>\n    <line x1=\"260\" y1=\"72\" x2=\"260\" y2=\"168\"/><line x1=\"320\" y1=\"72\" x2=\"320\" y2=\"168\"/>\n    <line x1=\"380\" y1=\"72\" x2=\"380\" y2=\"168\"/><line x1=\"440\" y1=\"72\" x2=\"440\" y2=\"168\"/>\n    <line x1=\"500\" y1=\"72\" x2=\"500\" y2=\"168\"/><line x1=\"560\" y1=\"72\" x2=\"560\" y2=\"168\"/>\n    <line x1=\"620\" y1=\"72\" x2=\"620\" y2=\"168\"/><line x1=\"680\" y1=\"72\" x2=\"680\" y2=\"168\"/>\n    <line x1=\"700\" y1=\"72\" x2=\"700\" y2=\"168\"/><line x1=\"720\" y1=\"72\" x2=\"720\" y2=\"168\"/>\n    <line x1=\"740\" y1=\"72\" x2=\"740\" y2=\"168\"/><line x1=\"760\" y1=\"72\" x2=\"760\" y2=\"168\"/>\n    <line x1=\"780\" y1=\"72\" x2=\"780\" y2=\"168\"/>\n    <text x=\"170\" y=\"195\" fill=\"#2e7d32\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">Close spacing near supports (high shear)<\/text>\n    <text x=\"450\" y=\"195\" fill=\"#2e7d32\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">Wider spacing at midspan<\/text>\n  <\/g>\n  <!-- Cross-section -->\n  <g id=\"s4\" class=\"hide\">\n    <text x=\"450\" y=\"270\" text-anchor=\"middle\" font-weight=\"bold\">Cross-Section at Midspan<\/text>\n    <rect x=\"370\" y=\"285\" width=\"160\" height=\"180\" fill=\"#e0e0e0\" stroke=\"#555\" stroke-width=\"3\"/>\n    <rect x=\"385\" y=\"300\" width=\"130\" height=\"150\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"3\" rx=\"6\"/>\n    <circle cx=\"395\" cy=\"312\" r=\"7\" fill=\"#1565c0\"/><circle cx=\"505\" cy=\"312\" r=\"7\" fill=\"#1565c0\"/>\n    <circle cx=\"397\" cy=\"438\" r=\"9\" fill=\"#c62828\"/><circle cx=\"450\" cy=\"438\" r=\"9\" fill=\"#c62828\"/><circle cx=\"503\" cy=\"438\" r=\"9\" fill=\"#c62828\"/>\n    <text x=\"360\" y=\"315\" text-anchor=\"end\" fill=\"#1565c0\" font-size=\"13\">Asc (compression)<\/text>\n    <text x=\"360\" y=\"442\" text-anchor=\"end\" fill=\"#c62828\" font-size=\"13\">Ast (tension)<\/text>\n    <text x=\"545\" y=\"375\" fill=\"#2e7d32\" font-size=\"13\">Stirrup<\/text>\n    <text x=\"545\" y=\"300\" font-size=\"12\">Cover<\/text>\n  <\/g>\n  <!-- Concrete pour -->\n  <g id=\"s5\" class=\"hide\">\n    <rect x=\"100\" y=\"60\" width=\"700\" height=\"120\" fill=\"#9e9e9e\" opacity=\".35\"/>\n  <\/g>\n<\/svg>\n\n<script>\nconst steps=[\n [\"Step 1: Formwork and supports. Simply supported span with 25 mm clear cover.\",0],\n [\"Step 2: Place compression steel (Asc) near the top, held by stirrup corners.\",1],\n [\"Step 3: Place tension steel (Ast) at the bottom, anchored into supports.\",2],\n [\"Step 4: Tie stirrups, closely spaced near supports for shear, wider at midspan.\",3],\n [\"Step 5: Cross-section shows Asc top, Ast bottom, stirrup and cover.\",4],\n [\"Step 6: Pour and compact concrete, then cure for at least 7 days.\",5]\n];\nlet timers=[];\nfunction reset(){timers.forEach(clearTimeout);timers=[];\n for(let i=0;i<6;i++)document.getElementById(\"s\"+i).setAttribute(\"class\",\"hide\");\n document.getElementById(\"caption\").textContent=\"Press Play\";}\nfunction play(){reset();\n steps.forEach((s,i)=>timers.push(setTimeout(()=>{\n  document.getElementById(\"caption\").textContent=s[0];\n  document.getElementById(\"s\"+s[1]).setAttribute(\"class\",\"show\");\n },i*2500+200)));}\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Seismic Forces", "h": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Seismic Forces on a Tall Building<\/title>\n<style>\n  body{margin:0;font-family:sans-serif;overflow:hidden}\n  #ui{position:absolute;top:10px;left:10px;background:#fffd;padding:10px;border-radius:8px;max-width:290px;font-size:13px}\n  select,input{width:100%;margin:4px 0}\n<\/style>\n<script type=\"importmap\">{\"imports\":{\"three\":\"https://unpkg.com/three@0.160.0/build/three.module.js\",\"three/addons/\":\"https://unpkg.com/three@0.160.0/examples/jsm/\"}}<\/script>\n<\/head>\n<body>\n<div id=\"ui\">\n  <b>Seismic effects on a tall building<\/b><br>\n  <select id=\"mode\">\n    <option value=\"lateral\">S-wave: lateral shaking (shear / drift)<\/option>\n    <option value=\"vertical\">P-wave: vertical shaking (axial load)<\/option>\n    <option value=\"torsion\">Torsion: twisting (asymmetric building)<\/option>\n    <option value=\"rocking\">Overturning / rocking<\/option>\n    <option value=\"softstory\">Soft-story failure (weak ground floor)<\/option>\n    <option value=\"resonance\">Resonance (period match, amplified sway)<\/option>\n    <option value=\"all\">Combined: all forces<\/option>\n  <\/select>\n  Intensity <input id=\"amp\" type=\"range\" min=\"0.1\" max=\"1\" step=\"0.05\" value=\"0.5\">\n  Frequency (Hz) <input id=\"freq\" type=\"range\" min=\"0.3\" max=\"3\" step=\"0.1\" value=\"1\">\n  <div id=\"info\"><\/div>\n  <small>Colors: green = low drift, red = high drift/damage risk. Drag to orbit, scroll to zoom.<\/small>\n<\/div>\n<script type=\"module\">\nimport * as THREE from 'three';\nimport {OrbitControls} from 'three/addons/controls/OrbitControls.js';\n\nconst scene=new THREE.Scene(); scene.background=new THREE.Color(0xcfe8ff);\nconst cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,500);\ncam.position.set(45,30,55);\nconst r=new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth,innerHeight);\ndocument.body.appendChild(r.domElement);\nconst ctl=new OrbitControls(cam,r.domElement); ctl.target.set(0,14,0);\nscene.add(new THREE.AmbientLight(0xffffff,0.7));\nconst sun=new THREE.DirectionalLight(0xffffff,0.8); sun.position.set(30,60,20); scene.add(sun);\n\n// Ground (moves with the earthquake)\nconst ground=new THREE.Mesh(new THREE.BoxGeometry(70,2,70),new THREE.MeshLambertMaterial({color:0x7a6a55}));\nground.position.y=-1; scene.add(ground);\nscene.add(new THREE.GridHelper(70,14)).position.y=0.01;\n\n// Building\nconst N=20,fh=1.5,W=8;\nconst floors=[];\nfor(let i=0;i<N;i++){\n  const m=new THREE.Mesh(new THREE.BoxGeometry(W,fh*0.92,W),new THREE.MeshLambertMaterial({color:0x44cc66}));\n  scene.add(m); floors.push(m);\n}\n// Asymmetric core block for torsion\nconst core=new THREE.Mesh(new THREE.BoxGeometry(2,N*fh,2),new THREE.MeshLambertMaterial({color:0x3355aa}));\ncore.userData.off=3; scene.add(core);\n\n// Arrow showing ground motion direction\nconst arrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(-30,1,-36),10,0xff0000);\nscene.add(arrow);\n\nconst $=id=>document.getElementById(id);\nconst info={\n lateral:\"S-waves shear the building sideways. Upper floors lag behind the ground, so the biggest inter-storey drift appears in the lower-middle floors.\",\n vertical:\"P-waves push up/down, changing axial load in columns (up to \u00b1g-level). Usually less damaging, but can cause column buckling and slab damage.\",\n torsion:\"Mass/stiffness centres don't coincide (blue core is off-centre), so the building twists. Corner columns take the highest drift.\",\n rocking:\"Lateral force at the centre of mass creates an overturning moment about the base edge, causing foundation uplift and compression.\",\n softstory:\"The weak ground floor has low stiffness, so all drift concentrates there, leading to pancake or collapse risk.\",\n resonance:\"When the ground frequency matches the building's natural frequency (~1 Hz for tall buildings here), sway is strongly amplified.\",\n all:\"Lateral + vertical + torsion + rocking acting together, the real-world case.\"\n};\nconst f0=1.0; // natural frequency\nfunction update(t){\n  const mode=$('mode').value, A=+$('amp').value*3, f=+$('freq').value;\n  let freq=f; if(mode==='resonance') freq=f0;\n  const w=2*Math.PI*freq, s=Math.sin(w*t);\n  const gx=(mode==='lateral'||mode==='softstory'||mode==='resonance'||mode==='all'||mode==='torsion')?A*0.4*s:0;\n  const gy=(mode==='vertical'||mode==='all')?A*0.15*Math.sin(w*t*1.8):0;\n  ground.position.x=gx; ground.position.y=-1+gy;\n  // dynamic amplification: response factor vs frequency ratio (damping 5%)\n  const beta=freq/f0, z=0.05;\n  const amp=1/Math.sqrt((1-beta*beta)**2+(2*z*beta)**2);\n  const R=Math.min(amp,8)*(mode==='resonance'?1:0.6);\n  let prev=gx, maxD=0;\n  const disp=[];\n  for(let i=0;i<N;i++){\n    const h=(i+1)/N;\n    let d=0, th=0, rock=0, shape=Math.pow(h,1.5);\n    if(mode==='softstory'){ shape = i===0 ? 0.6*h*N/N*8 : 0.6*8/N*1+0.02*h; shape=(i===0?0.5:0.5+0.05*h); }\n    if(['lateral','resonance','softstory','all','torsion'].includes(mode)) d=A*0.25*R*shape*s*(mode==='softstory'?1.2:1);\n    if(mode==='torsion'||mode==='all') th=0.06*A*R*h*s;\n    if(mode==='rocking'||mode==='all') rock=0.012*A*h*s*(mode==='all'?0.6:1.5);\n    const fl=floors[i];\n    const vy=(mode==='vertical'||mode==='all')?A*0.03*h*Math.sin(w*t*1.8+h):0;\n    fl.position.set(gx+d+rock*i*fh*0.0+Math.sin(rock)*i*fh,(i+0.5)*fh+gy+vy+(mode==='rocking'?0:0),0);\n    fl.rotation.y=th; fl.rotation.z=-rock;\n    const drift=Math.abs(d-prev+gx*0)/fh; prev=d;\n    disp.push(drift); maxD=Math.max(maxD,drift);\n    if(mode==='vertical') {\n      const v=Math.abs(Math.sin(w*t*1.8))*(1-h)*1.0;\n      fl.material.color.setHSL(0.33*(1-v),0.8,0.5);\n    }\n  }\n  if(mode!=='vertical') for(let i=0;i<N;i++){\n    const v=Math.min(disp[i]/(maxD||1)*Math.min(maxD*6,1),1);\n    floors[i].material.color.setHSL(0.33*(1-v),0.8,0.5);\n  }\n  core.visible=(mode==='torsion'||mode==='all');\n  core.position.set(floors[N>>1].position.x+3,N*fh/2+gy,0);\n  core.rotation.y=floors[N>>1].rotation.y; core.rotation.z=floors[N>>1].rotation.z;\n  arrow.visible=!['vertical','rocking'].includes(mode);\n  $('info').innerHTML=`<p>${info[mode]}<\/p><p>Amplification factor: <b>${amp.toFixed(1)}\u00d7<\/b><\/p>`;\n}\nconst clock=new THREE.Clock();\n(function loop(){\n  requestAnimationFrame(loop);\n  update(clock.getElapsedTime()); ctl.update(); r.render(scene,cam);\n})();\naddEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});\n<\/script>\n<\/body>\n<\/html>"}, {"t": "Ramayana Game", "h": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Ramayana Adventure<\/title>\n<style>\n  body{margin:0;font-family:Comic Sans MS,sans-serif;background:#ffe9b8;text-align:center}\n  h1{color:#c2410c;margin:10px;font-size:28px}\n  .card{max-width:720px;margin:10px auto;padding:10px}\n  #scene{position:relative;height:200px;border-radius:20px;overflow:hidden;transition:background 1s}\n  #hero{position:absolute;bottom:50px;left:10px;font-size:54px;transition:left 1s ease}\n  #goal{position:absolute;bottom:55px;right:10px;font-size:54px;animation:bob 2s infinite}\n  #deco{position:absolute;top:10px;right:20px;font-size:40px;animation:spin 12s linear infinite}\n  .jump{animation:jump 1s}\n  .shake{animation:shake .4s}\n  .wave{position:absolute;bottom:0;font-size:30px;animation:bob 2s ease-in-out infinite}\n  @keyframes jump{50%{transform:translateY(-90px) rotate(20deg)}}\n  @keyframes bob{50%{transform:translateY(-8px)}}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}\n  @keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.3)}100%{transform:scale(1)}}\n  #chapter{font-weight:bold;color:#7c2d12;font-size:20px;margin-bottom:6px}\n  #story{font-size:18px;background:#fff7e0;border-radius:14px;padding:10px;margin:10px 0}\n  #q{font-size:24px;margin:10px;min-height:50px}\n  button{font-size:22px;margin:6px;padding:12px 20px;border:0;border-radius:16px;\n    background:#fb923c;color:#fff;cursor:pointer}\n  button:hover{background:#ea580c}\n  .big{font-size:40px;padding:14px 24px}\n  #speak{background:#0ea5e9;font-size:18px}\n  #msg{font-size:20px;min-height:50px;color:#166534}\n  #stars{font-size:22px}\n  .star{display:inline-block;animation:pop .5s}\n<\/style>\n<\/head>\n<body>\n<h1>\ud83e\ude94 Ramayana Adventure \ud83e\ude94<\/h1>\n\n<div class=\"card\" id=\"menu\">\n  <p style=\"font-size:22px\">Pick your level:<\/p>\n  <button class=\"big\" onclick=\"start('little')\">\ud83c\udf31 Little Explorer<br><small>Ages 5\u20137<\/small><\/button>\n  <button class=\"big\" onclick=\"start('big')\">\ud83c\udff9 Story Hero<br><small>Ages 8\u201310<\/small><\/button>\n<\/div>\n\n<div class=\"card\" id=\"game\" style=\"display:none\">\n  <div id=\"chapter\"><\/div>\n  <div id=\"scene\">\n    <div id=\"deco\"><\/div><div id=\"hero\"><\/div><div id=\"goal\"><\/div>\n    <span class=\"wave\" style=\"left:10%\">\ud83c\udf0a<\/span>\n    <span class=\"wave\" style=\"left:40%;animation-delay:.5s\">\ud83c\udf3f<\/span>\n    <span class=\"wave\" style=\"left:70%;animation-delay:1s\">\ud83c\udf0a<\/span>\n  <\/div>\n  <div id=\"story\"><\/div>\n  <button id=\"speak\" onclick=\"say(currentText())\">\ud83d\udd0a Read to me<\/button>\n  <div id=\"q\"><\/div>\n  <div id=\"opts\"><\/div>\n  <div id=\"msg\"><\/div>\n  <div id=\"stars\"><\/div>\n<\/div>\n\n<script>\n// ---------- STORY DATA ----------\n// o = answer options. The FIRST option is always the correct one (the game shuffles them on screen).\n// Little Explorer (5-7) sees the first 2 options; Story Hero (8-10) sees all 3.\nconst CH=[\n {name:\"Chapter 1: Prince Rama of Ayodhya\",bg:\"linear-gradient(#ffd27f 60%,#86efac 60%)\",hero:\"\ud83e\udd34\",goal:\"\ud83c\udfef\",deco:\"\u2600\ufe0f\",\n  little:\"Rama was a kind prince. Everyone in Ayodhya loved him!\",\n  big:\"Rama was the eldest son of King Dasharatha of Ayodhya. He was brave, truthful and always kept his promises.\",\n  qs:[{q:\"Who is the eldest son of King Dasharatha?\",o:[\"Rama\",\"Bharata\",\"Lakshmana\"],f:\"Rama was the eldest of the four brothers: Rama, Bharata, Lakshmana and Shatrughna.\"},\n      {q:\"What is Rama most famous for?\",o:[\"Keeping his promises\",\"Winning every game\",\"Being the richest king\"],f:\"Keeping promises is called being truthful.\"}]},\n {name:\"Chapter 2: Sita's Swayamvar\",bg:\"linear-gradient(#fbcfe8 60%,#fde68a 60%)\",hero:\"\ud83c\udff9\",goal:\"\ud83d\udc78\",deco:\"\ud83c\udf38\",\n  little:\"Princess Sita lived in Mithila. Rama lifted a giant bow, and everyone cheered!\",\n  big:\"King Janaka held a swayamvar for Princess Sita. Whoever could string Lord Shiva's huge bow could marry her. Rama lifted it so easily that it snapped!\",\n  qs:[{q:\"Which princess did Rama marry?\",o:[\"Sita\",\"Urmila\",\"Mandavi\"],f:\"Urmila married Lakshmana and Mandavi married Bharata. Sita is Rama's wife.\"},\n      {q:\"What did Rama lift at the swayamvar?\",o:[\"Lord Shiva's giant bow\",\"A golden sword\",\"A heavy mace\"],f:\"The bow was so heavy that many strong kings could not lift it.\"}]},\n {name:\"Chapter 3: Into the Forest\",bg:\"linear-gradient(#bbf7d0 60%,#16a34a 60%)\",hero:\"\ud83d\udeb6\",goal:\"\ud83c\udf33\",deco:\"\ud83e\udd9c\",\n  little:\"Rama, Sita and Lakshmana went to live in the forest. They made friends with animals!\",\n  big:\"Because of a promise made by his father, Rama lived in the forest for 14 years with Sita and his loyal brother Lakshmana.\",\n  qs:[{q:\"Who went to the forest with Rama and Sita?\",o:[\"Lakshmana\",\"Bharata\",\"Hanuman\"],f:\"Bharata stayed in Ayodhya and ruled with Rama's sandals on the throne.\"},\n      {q:\"How many years did Rama stay in the forest?\",o:[\"14\",\"12\",\"7\"],f:\"Rama lived in the forest for 14 years.\"}]},\n {name:\"Chapter 4: The Golden Deer\",bg:\"linear-gradient(#fef08a 60%,#65a30d 60%)\",hero:\"\ud83e\udd8c\",goal:\"\u2728\",deco:\"\ud83c\udf1f\",\n  little:\"A shiny golden deer ran by. It was a magic trick by a bad helper of Ravana!\",\n  big:\"Sita saw a beautiful golden deer and asked Rama to catch it. It was really the demon Maricha in disguise, sent by Ravana to trick them.\",\n  qs:[{q:\"What color was the magic deer?\",o:[\"Golden\",\"Silver\",\"White with spots\"],f:\"It looked beautiful, but it was a trick!\"},\n      {q:\"Who sent the magic deer to trick Rama?\",o:[\"Ravana\",\"Vali\",\"Kumbhakarna\"],f:\"Ravana, the king of Lanka, made unkind choices.\"}]},\n {name:\"Chapter 5: Hanuman Leaps to Lanka\",bg:\"linear-gradient(#8fd3ff 60%,#1e90ff 60%)\",hero:\"\ud83d\udc12\",goal:\"\ud83c\udff0\",deco:\"\u2600\ufe0f\",\n  little:\"Brave Hanuman jumped over the big sea to find Sita!\",\n  big:\"Hanuman, son of the wind god, grew huge and leaped across the ocean to Lanka. There he found Sita and gave her Rama's ring.\",\n  qs:[{q:\"Who leaped across the sea to Lanka?\",o:[\"Hanuman\",\"Angada\",\"Jambavan\"],f:\"Jambavan reminded Hanuman of his own powers. Then Hanuman made the leap!\"},\n      {q:\"What did Hanuman give Sita to show Rama sent him?\",o:[\"Rama's ring\",\"Rama's crown\",\"Lakshmana's necklace\"],f:\"Sita recognized the ring and knew Rama had not forgotten her.\"}]},\n {name:\"Chapter 6: Sanjeevani Mountain\",bg:\"linear-gradient(#c4b5fd 60%,#6b7280 60%)\",hero:\"\ud83d\udc12\",goal:\"\u26f0\ufe0f\",deco:\"\ud83c\udf19\",\n  little:\"Lakshmana was hurt. Hanuman flew and brought a whole mountain of medicine!\",\n  big:\"Lakshmana was badly wounded in battle. Hanuman could not tell which herb was Sanjeevani, so he lifted the whole mountain and brought it back, saving Lakshmana's life.\",\n  qs:[{q:\"What did Hanuman carry back from the Himalayas?\",o:[\"A whole mountain of herbs\",\"A basket of herbs\",\"A big tree\"],f:\"He wasn't sure which herb was Sanjeevani, so he brought the whole mountain!\"},\n      {q:\"Who was Hanuman trying to heal?\",o:[\"Lakshmana\",\"Sugriva\",\"Jambavan\"],f:\"Helping friends in need is a Hanuman superpower.\"}]},\n {name:\"Chapter 7: The Bridge & the Win\",bg:\"linear-gradient(#a5f3fc 60%,#0891b2 60%)\",hero:\"\ud83d\udc35\",goal:\"\ud83e\ude94\",deco:\"\ud83c\udf05\",\n  little:\"All the animals built a stone bridge. Rama won, and everyone lit lamps. Happy Diwali!\",\n  big:\"Rama's vanara army built the Ram Setu bridge by working together. Rama defeated Ravana on Dussehra, and when he returned to Ayodhya people lit rows of lamps: the festival of Diwali.\",\n  qs:[{q:\"What did Rama's army build to reach Lanka?\",o:[\"A bridge across the sea\",\"A fleet of boats\",\"A tunnel under the sea\"],f:\"Teamwork made the impossible possible.\"},\n      {q:\"Which festival celebrates Rama coming home to Ayodhya?\",o:[\"Diwali\",\"Holi\",\"Dussehra\"],f:\"Dussehra celebrates Rama's victory over Ravana. Diwali celebrates his return home.\"}]}\n];\n\n// ---------- STATE ----------\nlet level, c=0, qi=0, stars=0;\nconst $=id=>document.getElementById(id);\nconst Q=()=>CH[c].qs[qi];\nconst currentText=()=>CH[c][level]+\" \"+Q().q;\n\n// ---------- SOUND EFFECTS ----------\nlet ac;\nfunction tone(f,d,t='sine',when=0){\n  ac=ac||new (window.AudioContext||window.webkitAudioContext)();\n  const o=ac.createOscillator(),g=ac.createGain();\n  o.type=t;o.frequency.value=f;o.connect(g);g.connect(ac.destination);\n  g.gain.setValueAtTime(.2,ac.currentTime+when);\n  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+when+d);\n  o.start(ac.currentTime+when);o.stop(ac.currentTime+when+d);\n}\nconst happy=()=>{tone(523,.15,'triangle');tone(659,.15,'triangle',.15);tone(784,.3,'triangle',.3)};\nconst oops=()=>tone(220,.3,'sawtooth');\nconst cheer=()=>[523,587,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',i*.12));\n\n// ---------- READ-ALOUD (INDIAN ENGLISH VOICE) ----------\nlet voices=[];\nfunction loadVoices(){voices=speechSynthesis.getVoices()}\nif('speechSynthesis' in window){\n  loadVoices();\n  speechSynthesis.onvoiceschanged=loadVoices;\n}\nfunction indianVoice(){\n  return voices.find(v=>v.lang==='en-IN')\n      || voices.find(v=>v.lang.replace('_','-').toLowerCase()==='en-in')\n      || voices.find(v=>/india|veena|rishi|heera|neerja|prabhat/i.test(v.name))\n      || voices.find(v=>v.lang.startsWith('hi'));\n}\nfunction say(t){\n  if(!('speechSynthesis' in window))return;\n  speechSynthesis.cancel();\n  const u=new SpeechSynthesisUtterance(t);\n  const v=indianVoice();\n  if(v){u.voice=v;u.lang=v.lang}else{u.lang='en-IN'}\n  u.rate=level==='little'?.85:.95;\n  u.pitch=1.1;\n  speechSynthesis.speak(u);\n}\n\n// ---------- GAME LOGIC ----------\nfunction start(l){\n  level=l;\n  $('menu').style.display='none';\n  $('game').style.display='block';\n  ac=ac||new (window.AudioContext||window.webkitAudioContext)();\n  loadChapter();\n}\nfunction loadChapter(){\n  const ch=CH[c];qi=0;\n  $('chapter').textContent=ch.name;\n  $('scene').style.background=ch.bg;\n  $('hero').textContent=ch.hero;\n  $('goal').textContent=ch.goal;\n  $('deco').textContent=ch.deco;\n  $('hero').style.left=\"10px\";\n  $('story').textContent=ch[level];\n  $('msg').textContent='';\n  showQ();\n  say(ch[level]+\" \"+Q().q);\n}\nfunction showQ(){\n  const q=Q();\n  $('q').textContent=q.q;\n  const n=level==='little'?2:3;\n  const box=$('opts');box.innerHTML='';\n  q.o.slice(0,n).map((t,k)=>({t,k})).sort(()=>Math.random()-.5).forEach(({t,k})=>{\n    const b=document.createElement('button');\n    b.textContent=t;\n    b.onclick=()=>pick(k,b);\n    box.appendChild(b);\n  });\n}\nfunction pick(k,b){\n  const q=Q(),h=$('hero');\n  if(k===0){\n    happy();stars++;\n    $('stars').innerHTML=Array.from({length:stars},()=>'<span class=\"star\">\u2b50<\/span>').join('');\n    $('msg').style.color=\"#166534\";\n    $('msg').textContent=\"\ud83c\udf89 Yay! \"+q.f;\n    say(\"Yay! \"+q.f);\n    h.classList.add('jump');\n    const w=$('scene').clientWidth-140;\n    h.style.left=(10+w*(qi+1)/CH[c].qs.length)+\"px\";\n    document.querySelectorAll('#opts button').forEach(x=>x.disabled=true);\n    setTimeout(()=>{h.classList.remove('jump');next()},3500);\n  }else{\n    oops();\n    $('msg').style.color=\"#b91c1c\";\n    $('msg').textContent=level==='little'?\"Try again! You can do it! \ud83d\udcaa\":\"Not quite. Re-read the story and try again! \ud83d\udcaa\";\n    b.classList.add('shake');\n    setTimeout(()=>b.classList.remove('shake'),400);\n    b.disabled=true;b.style.opacity=.4;\n  }\n}\nfunction next(){\n  qi++;\n  if(qi<CH[c].qs.length){\n    $('msg').textContent='';\n    showQ();\n    say(Q().q);\n    return;\n  }\n  c++;\n  if(c<CH.length){loadChapter();return}\n  finish();\n}\nfunction finish(){\n  cheer();\n  $('chapter').textContent=\"\ud83c\udf8a You finished the Ramayana! \ud83c\udf8a\";\n  $('scene').style.background=\"linear-gradient(#1e1b4b 60%,#312e81 60%)\";\n  $('hero').textContent=\"\ud83d\udc51\";\n  $('goal').textContent=\"\ud83e\ude94\";\n  $('deco').textContent=\"\ud83c\udf86\";\n  $('hero').style.left=\"10px\";\n  $('story').textContent=\"Good wins over bad. Be kind, keep promises and help your friends, just like Rama and Hanuman! You earned \"+stars+\" stars!\";\n  $('q').textContent=\"Happy Diwali! \ud83e\ude94\";\n  $('msg').textContent='';\n  $('opts').innerHTML='<button onclick=\"location.reload()\">Play again \ud83d\udd01<\/button>';\n  $('speak').style.display='none';\n  say(\"Happy Diwali! You finished the Ramayana!\");\n}\n<\/script>\n<\/body>\n<\/html>"}];
const nav=document.getElementById('nav'),f=document.getElementById('f');
function show(i){
  f.srcdoc=P[i].h;
  [...nav.children].forEach((a,k)=>a.classList.toggle('on',k===i));
  
}
P.forEach((p,i)=>{const a=document.createElement('a');a.href='javascript:void(0)';a.textContent=p.t;
  a.onclick=e=>{e.preventDefault();show(i)};nav.appendChild(a);});
show(0);
</script></body></html>
